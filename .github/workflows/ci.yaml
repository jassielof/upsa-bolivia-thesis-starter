name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
    name: Documents
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Set up Typst
        uses: typst-community/setup-typst@v5
      - name: Set up Task
        uses: go-task/setup-task@v2
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main
        id: set-up-homebrew
      - name: Install fonts
        run: brew install --cask font-fontawesome font-tex-gyre-{termes{,-math},heros,cursor,chorus} font-source-sans-3 font-source-serif-4
      - name: Build documents
        run: task
      - name: Build documents for web deployment
        run: task web
      - name: Upload pages artifacts
        uses: actions/upload-pages-artifact@v5
        with:
          name: out/
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: docs
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployment
        id: deployment
        uses: actions/deploy-pages@v5
