version: 3

env:
  TYPST_ROOT: .
  TYPST_FONT_PATHS: assets/fonts
tasks:
  default:
    desc: Genera los documentos principales del trabajo de grado
    deps:
      - plan
      - thesis
      - abstract
      - spine-cover
      - front-cover
      - cv
  cv:
    desc: Genera el documento de curriculum vitae
    cmds:
      - typst compile documents/cv/CV.typ
      - typst compile --format svg documents/cv/CV.typ
    sources:
      - documents/cv/CV.typ
    generates:
      - documents/cv/CV.pdf
      - documents/cv/CV.svg
  spine-cover:
    desc: Genera el lomo del libro
    cmds:
      - typst compile documents/book/spine-cover.typ
    sources:
      - documents/book/spine-cover.typ
      - "template/**/*.typ"
    generates:
      - documents/book/spine-cover.pdf
  front-cover:
    desc: Genera la portada (tapa externa) del libro
    cmds:
      - typst compile documents/book/front-cover.typ
    sources:
      - documents/book/front-cover.typ
      - "template/**/*.typ"
    generates:
      - documents/book/front-cover.pdf
  bime:
    env:
      TYPST_FEATURES: bundle
    desc: Genera los documentos requeridos para la BIME
    cmds:
      - typst compile --format bundle --pdf-standard a-3a documents/bime/book.typ
    sources:
      - "template/**/*.typ"
      - CITATION.cff
      - documents/bime/book.typ
    generates:
      - documents/bime/book.pdf
  plan:
    desc: Genera el documento de plan de trabajo
    cmds:
      - typst compile documents/plan/TFG-PLAN.typ
    sources:
      - documents/plan/TFG-PLAN.typ
      - "documents/plan/**/*.typ"
      - "template/**/*.typ"
    generates:
      - documents/plan/TFG-PLAN.pdf
  thesis:
    aliases:
      - tfg
    deps:
      - cv
    desc: Genera la tesis o documento principal del trabajo de grado
    cmds:
      - typst compile --pdf-standard ua-1,a-3a documents/thesis/TFG.typ
    sources:
      - "documents/thesis/**/*.typ"
      - CITATION.cff
      - "template/**/*.typ"
    generates:
      - documents/thesis/TFG.pdf
  study:
    desc: Genera el documento de estudio de factibilidad
    cmds:
      - typst compile documents/feasibility/study.typ
    generates:
      - documents/feasibility/study.pdf
    sources:
      - "documents/feasibility/**/*.typ"
      - "template/**/*.typ"
