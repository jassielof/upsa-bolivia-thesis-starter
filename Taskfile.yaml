version: 3

env:
  TYPST_ROOT: .
  TYPST_FONT_PATHS: assets/fonts
tasks:
  default:
    desc: Genera los documentos principales del trabajo de grado
    deps:
      - proposal
      - bime
  cv:
    desc: Genera el documento de Curriculum Vitae
    cmds:
      - typst compile documents/cv/CV.typ
      - typst compile --format svg documents/cv/CV.typ
    sources:
      - documents/cv/CV.typ
    generates:
      - documents/cv/CV.pdf
      - documents/cv/CV.svg
  bime:
    aliases:
      - bime-book
      - book
    deps:
      - thesis
    env:
      TYPST_FEATURES: bundle
    desc: Genera los documentos requeridos para la BIME
    cmds:
      - typst compile --format bundle --pdf-standard ua-1,a-3a documents/bime/book.typ
    sources:
      - "template/**/*.typ"
      - "documents/bime/book.typ"
    generates:
      - "documents/bime/book/**/*.pdf"
      - "documents/bime/book/**/*.bib"
  proposal:
    desc: Genera el documento de plan de trabajo
    cmds:
      - typst compile documents/proposal/proposal.typ
    sources:
      - documents/proposal/proposal.typ
      - "documents/proposal/**/*.typ"
      - "assets/images/**/*"
      - "template/**/*.typ"
    generates:
      - documents/proposal/proposal.pdf
  thesis:
    aliases:
      - tfg
    deps:
      - cv
    desc: Genera la tesis o documento principal del trabajo de grado
    cmds:
      - typst compile --pdf-standard ua-1,a-3a documents/thesis/thesis.typ
    sources:
      - "documents/thesis/**/*.typ"
      - "data/bib.haya.yaml"
      - "assets/images/**/*"
      - "template/**/*.typ"
    generates:
      - documents/thesis/thesis.pdf
  study:
    desc: Genera el documento de estudio de factibilidad
    cmds:
      - typst compile documents/feasibility/study.typ
    generates:
      - documents/feasibility/study.pdf
    sources:
      - "documents/feasibility/**/*.typ"
      - "template/**/*.typ"
      - "assets/images/**/*"
