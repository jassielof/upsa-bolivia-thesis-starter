version: 3

env:
  TYPST_ROOT: .
  TYPST_FONT_PATHS: assets/fonts
tasks:
  default:
    desc: Genera los documentos principales del trabajo de grado
    deps:
      - plan
      - thesis
      - abstract
      - spine-cover
      - front-cover
      - cv
  cv:
    dir: documents/cv/
    env:
      TYPST_ROOT: ../../
    desc: Genera el documento de curriculum vitae
    cmds:
      - typst compile CV.typ
      - typst compile CV.typ CV.svg
    generates:
      - CV.pdf
      - CV.svg
  spine-cover:
    dir: documents/book/
    env:
      TYPST_ROOT: ../../
    desc: Genera el lomo del libro
    cmds:
      - typst compile spine-cover.typ
    sources:
      - spine-cover.typ
      - ../../**/*.typ
    generates:
      - spine-cover.pdf
  front-cover:
    dir: documents/book/
    env:
      TYPST_ROOT: ../../
    desc: Genera la portada (tapa externa) del libro
    cmds:
      - typst compile front-cover.typ
    generates:
      - front-cover.pdf
  abstract:
    dir: documents/abstract/
    env:
      TYPST_ROOT: ../../
    desc: Genera el documento de resumen
    cmds:
      - typst compile abstract.typ
    generates:
      - abstract.pdf
  plan:
    dir: documents/plan/
    env:
      TYPST_ROOT: ../../
    desc: Genera el documento de plan de trabajo
    cmds:
      - typst compile TFG-PLAN.typ
    generates:
      - plan.pdf
  thesis:
    deps:
      - cv
    dir: documents/thesis/
    env:
      TYPST_ROOT: ../../
    desc: Genera la tesis o documento principal del trabajo de grado
    cmds:
      - typst compile --pdf-standard ua-1,a-3a TFG.typ
    sources:
      - "**/*.typ"
      - "../../**/*.typ"
    generates:
      - thesis.pdf
  study:
    dir: documents/feasibility/
    env:
      TYPST_ROOT: ../../
    desc: Genera el documento de estudio de factibilidad
    cmds:
      - typst compile study.typ
    generates:
      - study.pdf
    sources:
      - "**/*.typ"
      - "../../**/*.typ"
